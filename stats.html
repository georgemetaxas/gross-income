<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stats · Gross Income</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1208">
<link rel="icon" href="icons/logo.svg?v=2" type="image/svg+xml">
<style>
  @font-face { font-family: 'Bebas Neue'; font-weight: 400; font-display: swap; src: url(fonts/bebas-neue-400.woff2) format('woff2'); }
  @font-face { font-family: 'DM Mono'; font-weight: 400; font-display: swap; src: url(fonts/dm-mono-400.woff2) format('woff2'); }
  @font-face { font-family: 'DM Mono'; font-weight: 500; font-display: swap; src: url(fonts/dm-mono-500.woff2) format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 300 600; font-display: swap; src: url(fonts/dm-sans-var.woff2) format('woff2'); }
  :root {
    --bg: #1a1208; --surface: #231a0a; --surface2: #2a1f0e; --gold: #f5c842; --amber: #e07b00;
    --cream: #f5ead6; --muted: #a08060; --heading: #f0ddb0; --border: rgba(245,200,66,0.12);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 16px 64px; }
  a { color: var(--gold); }
  .back { display: inline-flex; align-items: center; gap: 8px; font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 2px;
    color: var(--cream); text-decoration: none; padding: 9px 0 8px; }
  .back svg { color: var(--gold); margin-top: -2px; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 44px; letter-spacing: 3px; color: var(--gold); line-height: 1; margin: 16px 0 2px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  h2 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 1.5px; color: var(--heading); margin: 0 0 12px; }
  .label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

  .range { display: flex; gap: 6px; margin-bottom: 18px; }
  .range button { font: 500 12px 'DM Mono', monospace; letter-spacing: 1px; color: var(--cream); background: transparent;
    border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px; cursor: pointer; }
  .range button.on { background: var(--gold); color: var(--bg); border-color: var(--gold); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; min-width: 0; }
  .kpi .v { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 1px; color: var(--gold); line-height: 1.1; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .n { font-size: 12px; color: var(--muted); }
  .kpi .v.name { font-size: 26px; white-space: normal; line-height: 1.05; }

  /* Per-game ranking: horizontal bars, one hue (gold) = minutes played */
  .rank { display: grid; gap: 14px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .game { font-weight: 600; color: var(--heading); white-space: nowrap; }
  .game .ico { margin-right: 6px; }
  .mins { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--cream); white-space: nowrap; }
  .track { height: 10px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; background: var(--gold); border-radius: 0 4px 4px 0; min-width: 2px; transition: width .5s ease; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

  /* Daily opens: columns anchored to the baseline */
  .daily { position: relative; padding-top: 34px; }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--border); }
  .col { flex: 1; height: 100%; display: flex; align-items: flex-end; cursor: default; }
  .col i { display: block; width: 100%; background: var(--amber); border-radius: 4px 4px 0 0; min-height: 0; }
  .col:hover i, .col.hl i { background: var(--gold); }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--cream); color: var(--bg); border-radius: 8px;
    padding: 6px 9px; font: 500 12px 'DM Mono', monospace; white-space: nowrap; pointer-events: none; display: none; }

  table { width: 100%; border-collapse: collapse; font-family: 'DM Mono', monospace; font-size: 12px; }
  th, td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 400; letter-spacing: 1px; }
  details summary { cursor: pointer; color: var(--gold); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; }
  .scroll { overflow-x: auto; margin-top: 10px; }

  .msg { text-align: center; padding: 40px 16px; }
  .msg .big { font-size: 48px; }
  .msg p { color: var(--muted); max-width: 360px; margin: 8px auto 18px; }
  .btn { display: inline-block; background: var(--gold); color: var(--bg); text-decoration: none; font-weight: 600; border-radius: 12px; padding: 12px 18px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; }
  .section { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 28px; letter-spacing: 2px; color: var(--gold); margin: 26px 0 10px; }
  .kpi .n.warn { color: var(--amber); font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; margin: -4px 0 14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="./"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>Back to the bog</a>
  <h1>Gross Stats</h1>
  <p class="sub">Founding Flushers, paid unlocks and which games people play on the throne.</p>
  <div id="app"><div class="msg"><div class="big">🧻</div><p>Unrolling the numbers…</p></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="stats.js"></script>
</body>
</html>
